# rldyour-cleaner override for the distro's /tmp aging policy.
#
# This file masks /usr/lib/tmpfiles.d/tmp.conf (same name, /etc wins) and is
# the override the stock file's own comment invites: "Clear tmp directories
# separately, to make them easier to override". It mirrors the stock file
# line for line — only the /tmp age changes.
#
# The distro default keeps /tmp entries for 30 days. On a build host that is
# an eternity — compiler scratch, test output and agent working dirs pile up
# to tens of gigabytes. 7 days still covers "came back to it next week".
D /tmp 1777 root root 7d
# /var/tmp stays untouched, exactly as the stock file leaves it (disabled).
#q /var/tmp 1777 root root 30d
