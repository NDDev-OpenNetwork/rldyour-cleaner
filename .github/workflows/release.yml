name: Release

# Tag push (v*) publishes binaries. The release stays a draft until every
# matrix leg has uploaded — a failed build never ships a partial release.
# gh (preinstalled on all runners) does the release — no third-party actions.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the crate version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${crate}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != version ${crate} in Cargo.toml"
            exit 1
          fi
      - name: Create draft
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            bin: rldyour-cleaner
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            bin: rldyour-cleaner
            ext: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: rldyour-cleaner
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: rldyour-cleaner
            ext: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: rldyour-cleaner.exe
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the cross toolchain pieces
        if: matrix.cross
        run: |
          rustup target add ${{ matrix.target }}
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # gcc alone links nothing: Scrt1.o/crti.o live in libc6-dev-*-cross
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi
        shell: bash

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Only consulted when the aarch64-linux leg actually links.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          base="rldyour-cleaner-${GITHUB_REF_NAME}-${{ matrix.name }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            # zip from inside the release dir so the archive stays flat
            (cd "target/${{ matrix.target }}/release" \
              && 7z a "${{ github.workspace }}/dist/${base}.zip" "${{ matrix.bin }}" >/dev/null)
          else
            tar -czf "dist/${base}.tar.gz" \
              -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          fi
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: Upload assets
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      # No checkout on this leg — gh needs -R to resolve the repository.
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
