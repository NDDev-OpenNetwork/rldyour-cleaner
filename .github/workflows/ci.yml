name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
      - run: shellcheck install.sh uninstall.sh
      - name: Validate the launchd plist
        run: python3 -c 'import plistlib; plistlib.load(open("platforms/macos/launchd/io.nddev.rldyour-cleaner.plist","rb"))'

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --all-features
      - name: Parse the PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1') {
            $null = [scriptblock]::Create((Get-Content $f -Raw))
            if ($?) { Write-Host "$f parses" } else { exit 1 }
          }

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --all-targets --locked
