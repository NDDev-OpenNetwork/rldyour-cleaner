name: Release

# Tag push (v*) publishes binaries. The release stays a draft until every
# matrix leg has uploaded — a failed build never ships a partial release.
# gh (preinstalled on all runners) does the release — no third-party actions.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the crate version
        run: ./scripts/check-version.sh "${GITHUB_REF_NAME}"
      - name: Create draft
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            bin: rldyour-cleaner
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            bin: rldyour-cleaner
            ext: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: rldyour-cleaner
            ext: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: rldyour-cleaner
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: rldyour-cleaner.exe
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the cross toolchain pieces
        if: matrix.cross
        run: |
          rustup target add ${{ matrix.target }}
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # gcc alone links nothing: Scrt1.o/crti.o live in libc6-dev-*-cross
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi
        shell: bash

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Only consulted when the aarch64-linux leg actually links.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Native tests
        if: ${{ !matrix.cross }}
        run: cargo test --locked

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/stage/platforms
          base="rldyour-cleaner-${GITHUB_REF_NAME}-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/stage/
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md dist/stage/
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp install.ps1 uninstall.ps1 dist/stage/
            (cd dist/stage && 7z a "${{ github.workspace }}/dist/${base}.zip" ./* >/dev/null)
          else
            cp install.sh uninstall.sh dist/stage/
            cp -R platforms/linux platforms/macos dist/stage/platforms/
            tar -czf "dist/${base}.tar.gz" -C dist/stage .
          fi
          rmdir dist/stage/platforms 2>/dev/null || true
          cd dist
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: Upload assets
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" dist/*.sha256 dist/*.tar.gz dist/*.zip --clobber
        # Each matrix leg has just one archive extension; nullglob omits the other.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      # No checkout on this leg — gh needs -R to resolve the repository.
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
