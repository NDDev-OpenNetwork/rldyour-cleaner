[package]
name = "rldyour-cleaner"
version = "0.1.1"
edition = "2024"
rust-version = "1.88" # let-chains in `if`; also the floor for cargo's own GC behavior we rely on
license = "AGPL-3.0-or-later"
description = "Native unused-cache GC with read-only build artifact inventory"
repository = "https://github.com/NDDev-OpenNetwork/rldyour-cleaner"
homepage = "https://github.com/NDDev-OpenNetwork/rldyour-cleaner"
keywords = ["cleaner", "cache", "disk-space", "build-artifacts", "janitor"]
categories = ["command-line-utilities"]

# Every dependency earns its place: `clap` is the estate's CLI convention and
# hand-rolling subcommand parsing buys nothing; `serde`+`toml` give the user an
# editable policy file; `walkdir` is the standard robust traversal (it also
# backs cargo-sweep); `fs2` covers private per-user run locking and read-only disk-space
# statistics portably (statvfs on Unix, GetDiskFreeSpaceEx on Windows). `serde_json` writes the last-run report the
# `status` command reads back.
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
walkdir = "2"
fs2 = "0.4"

# Native process groups/nonblocking pipes on Unix; Job Objects and pipe/thread
# APIs on Windows keep deadlines valid across inherited child-process output.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes",
] }

[dev-dependencies]
# Fixture directories need controlled mtimes to exercise the age gates; there
# is no way to set an mtime through std.
filetime = "0.2"

# The tool runs unattended under a systemd timer: small, quiet, and dead on
# fault rather than half-alive holding a directory rename.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
